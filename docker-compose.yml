services:
  redis:
    image: redis/redis-stack-server:7.4.0-v8
    container_name: semantic-llm-redis
    ports:
      - "6379:6379"
    volumes:
      - semantic-llm-redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  semantic-llm-redis-data:
